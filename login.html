<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Cafetería Escolar</title>
    <link rel="stylesheet" href="estilos/login.css">
</head>
<body>
    <main class="login-fondo">
        <section class="login-tarjeta" aria-labelledby="titulo-login">
            <div class="login-logo-wrap">
                <img src="img/cafe.png" alt="Logo Cafetería Escolar" class="login-logo">
            </div>

            <h1 id="titulo-login" class="login-titulo">Cafetería Escolar</h1>
            <p class="login-subtitulo">Inicia sesión para continuar</p>

            <div id="mensaje-login" class="login-mensaje" role="alert" hidden></div>

            <form id="form-login" class="login-form" action="auth.php" method="POST" novalidate>
                <div class="campo-grupo">
                    <span class="campo-icono" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Usuario..."
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="campo-grupo">
                    <span class="campo-icono" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                        </svg>
                    </span>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        type="button"
                        id="toggle-contrasena"
                        class="btn-ojo"
                        aria-label="Mostrar contraseña"
                        aria-pressed="false"
                    >
                        <svg class="icono-ojo-abierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icono-ojo-cerrado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.77 21.77 0 0 1 5.06-5.94"></path>
                            <path d="M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.8 21.8 0 0 1-3.17 4.35"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <button type="submit" id="btn-iniciar" class="btn-iniciar">Iniciar sesión</button>
            </form>

            <a href="#" id="enlace-olvide" class="login-olvide">¿Olvidaste tu contraseña?</a>

            <footer class="login-footer">www.cafeteriaescolar.com</footer>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
